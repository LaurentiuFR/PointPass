limit_req_zone $binary_remote_addr zone=pointpass_api:1m rate=10r/s;
log_format pointpass_safe '$time_iso8601 $remote_addr $request_method $uri $status $body_bytes_sent $request_time';
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 62.238.115.207;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pointpass-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 62.238.115.207;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/pointpass-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pointpass-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PointPassTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    access_log /var/log/nginx/pointpass-access.log pointpass_safe;
    error_log /var/log/nginx/pointpass-error.log warn;
    add_header Strict-Transport-Security 'max-age=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    # Workers use loopback directly. Never proxy administrative routes publicly.
    location ~* ^/internal { return 404; }
    location / {
        limit_req zone=pointpass_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host 62.238.115.207;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}
