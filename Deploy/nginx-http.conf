# Bootstrap HTTP-01 only. HTTPS configuration replaces this after trusted issuance.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 62.238.115.207;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/pointpass-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
